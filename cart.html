<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Game Hub — корзина покупок. Просматривайте добавленные игры и оформляйте заказ." />
  <title>Game Hub — Корзина</title>

  <!-- Design System & Styles -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/cart.css" />
</head>
<body>
  <!-- Site Header (Shared Component) -->
  <header id="main-header" class="site-header" role="banner"></header>

  <!-- Main Cart Content -->
  <main class="container cart-page" role="main">
    <div class="cart-header">
      <h1 class="cart-title">Корзина покупок</h1>
    </div>

    <!-- Success Screen on Order Completion -->
    <div id="checkout-success-container" style="display: none;"></div>

    <!-- Empty Cart State -->
    <div id="cart-empty-state" class="catalog-empty" style="display: none;">
      <h2 class="catalog-empty-title">Ваша корзина пуста</h2>
      <p class="catalog-empty-text">
        Вы пока не добавили ни одной игры в корзину. Ознакомьтесь с каталогом и выберите интересующие вас игры.
      </p>
      <a href="index.html" class="btn btn-primary">В каталог игр</a>
    </div>

    <!-- Cart Layout (Items + Summary) -->
    <div class="cart-layout" id="cart-layout" style="display: none;">
      <!-- Items Column -->
      <div class="cart-items-container" id="cart-items-container">
        <div class="skeleton" style="height: 90px;"></div>
        <div class="skeleton" style="height: 90px;"></div>
      </div>

      <!-- Order Summary Aside -->
      <aside class="cart-summary-card" id="cart-summary-card" role="complementary">
        <h2 class="summary-title">Итого заказа</h2>
        <div class="summary-row">
          <span class="text-secondary">Товары:</span>
          <span id="summary-items-count">0 шт.</span>
        </div>
        <div class="summary-row">
          <span class="text-secondary">Сумма:</span>
          <span id="summary-subtotal">0 ₸</span>
        </div>
        <div class="summary-total-row">
          <span class="total-label">К оплате:</span>
          <span class="total-amount" id="summary-total">0 ₸</span>
        </div>
        <button type="button" class="btn btn-checkout" id="btn-checkout">
          Оформить заказ
        </button>
      </aside>
    </div>
  </main>

  <!-- Scripts (ES6 Modules) -->
  <script type="module" src="js/header.js"></script>
  <script type="module" src="js/cart-page.js"></script>
</body>
</html>
