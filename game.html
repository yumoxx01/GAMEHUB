<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Game Hub — подробная страница игры. Описание, системные требования, скриншоты, видео, отзывы и оценки." />
  <title>Game Hub — Страница игры</title>

  <!-- Design System & Styles -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/catalog.css" />
</head>
<body>
  <!-- Site Header (Shared Component) -->
  <header id="main-header" class="site-header" role="banner"></header>

  <!-- Main Game Detail Container -->
  <main class="container detail-page" role="main">
    <!-- Breadcrumbs Navigation -->
    <nav class="breadcrumbs" aria-label="Навигационная цепочка">
      <a href="index.html">Главная</a>
      <span aria-hidden="true">/</span>
      <a href="index.html">Каталог</a>
      <span aria-hidden="true">/</span>
      <span id="breadcrumb-current" aria-current="page">Загрузка...</span>
    </nav>

    <!-- Error State Container (e.g. invalid or missing gameId) -->
    <div id="detail-error" style="display: none;" role="alert"></div>

    <!-- Main Detail Content (Injected by detail-page.js) -->
    <div id="detail-container">
      <div class="skeleton" style="height: 380px; margin-bottom: var(--space-6);"></div>
      <div class="skeleton" style="height: 120px; margin-bottom: var(--space-6);"></div>
      <div class="skeleton" style="height: 200px;"></div>
    </div>
  </main>

  <!-- Scripts (ES6 Modules) -->
  <script type="module" src="js/header.js"></script>
  <script type="module" src="js/detail-page.js"></script>
</body>
</html>
